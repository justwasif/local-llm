# Hardware-constrained smoke-training profile for a 6 GB RTX 4050.
# It validates the same QLoRA approach as the 7B production config on a small corpus.
model: Qwen/Qwen2.5-1.5B-Instruct
max_length: 256
load_in_4bit: true
lora: {r: 8, alpha: 16, dropout: 0.05}
training: {epochs: 1, batch_size: 1, gradient_accumulation_steps: 4, learning_rate: 0.0001}
output_dir: outputs/demo_1_5b_lora
