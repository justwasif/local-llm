dataset: {name: data/raw/seeds/all_seeds.jsonl, max_samples: null}
hygiene: {secrets_detection: true, pii_masking: true, toxicity_filter: true}
generation_task: multi_turn
num_questions: 3
generator_llm: {model: openai/Qwen/Qwen2.5-7B-Instruct, api_base: http://localhost:30000/v1, api_key: EMPTY, temperature: 0.8, max_tokens: 2048}
judge_llm: {model: openai/Qwen/Qwen2.5-7B-Instruct, api_base: http://localhost:30000/v1, api_key: EMPTY, temperature: 0.1}
system_prompt: Generate realistic, useful multi-turn public-service conversations in the source language.
hallucination_threshold: 0.70
reward_threshold: 0.65
dedup: minhash
enable_reward_refiner: true
export_formats: [sharegpt, messages]
output_dir: data/curated/multiturn_generation
