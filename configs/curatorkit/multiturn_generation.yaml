name: indic_multiturn
readers:
- type: jsonl
  path: data/raw/seeds/all_seeds.jsonl
  format: pretrain
gates:
- type: schema
  min_tokens: 2
  max_tokens: 2048
  required_fields:
  - output
- type: hallucination
  hallucination_threshold: 0.6
  on_judge_error: reject
normalizers:
- type: text_cleaner
- type: exact_dedup
exporters:
- type: messages
llm:
  model: openai/local-llm
  api_base: http://127.0.0.1:30000/v1
  api_key: EMPTY
  temperature: 0.2
  max_tokens: 768
  concurrency: 1
  timeout: 120
  max_retries: 1
generators:
- type: multiturn
  num_turns: 2
