name: indic_preferences
readers:
- type: jsonl
  path: data/raw/seeds/preference_seeds.jsonl
  format: alpaca
gates:
- type: schema
  min_tokens: 2
  max_tokens: 2048
  required_fields:
  - instruction
  - output
normalizers:
- type: text_cleaner
- type: exact_dedup
exporters:
- type: dpo
llm:
  model: openai/local-llm
  api_base: http://127.0.0.1:30000/v1
  api_key: EMPTY
  temperature: 0.2
  max_tokens: 768
  concurrency: 1
  timeout: 120
  max_retries: 1
generators:
- type: preference
  prompt_template: 'Create a preference pair. Use the SAME language or code mixing
    as the instruction. The chosen answer must be specific, concise and supported
    by the reference. The rejected answer must be vague or incomplete, while remaining
    factually correct. Do not add facts. Instruction: {instruction}

    Reference: {context_section}

    Return ONLY JSON: {{"chosen":"...", "rejected":"..."}}'
