name: grounded_indic_qa
readers:
- type: jsonl
  path: data/raw/seeds/all_seeds.jsonl
  format: pretrain
gates:
- type: schema
  min_tokens: 2
  max_tokens: 2048
  required_fields:
  - output
- type: hallucination
  hallucination_threshold: 0.6
  on_judge_error: reject
normalizers:
- type: text_cleaner
- type: exact_dedup
exporters:
- type: messages
llm:
  model: openai/local-llm
  api_base: http://127.0.0.1:30000/v1
  api_key: EMPTY
  temperature: 0.2
  max_tokens: 768
  concurrency: 1
  timeout: 120
  max_retries: 1
generators:
- type: qa
  num_questions: 2
  prompt_template: 'Create exactly {num_questions} simple question-answer pairs grounded
    only in this source. Use the SAME language and code mixing as the source. Keep
    each answer to one short sentence. Source: {context}

    Return ONLY a JSON array: [{{"question":"...", "answer":"..."}}]'
